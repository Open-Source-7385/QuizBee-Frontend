<div class="container">
  <div class="header">
    <div class="header-left">
      <button mat-icon-button (click)="goBack()" class="back-btn" title="Back to Feedback">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2>Feedback Responses</h2>
    </div>
    <button mat-raised-button color="primary" (click)="addResponse()">
      Add Response
    </button>
  </div>

  <div class="table-container">
    @if (store.loading()) {
      <div class="loading">
        <mat-progress-spinner diameter="50" mode="indeterminate"></mat-progress-spinner>
      </div>
    } @else if (store.error()) {
      <mat-error class="error">{{ store.error() }}</mat-error>
    } @else {
      <table mat-table [dataSource]="store.feedbackResponses()" class="mat-elevation-z8">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let response">{{ response.id }}</td>
        </ng-container>

        <!-- Response Column -->
        <ng-container matColumnDef="response">
          <th mat-header-cell *matHeaderCellDef>Response</th>
          <td mat-cell *matCellDef="let response" class="response-cell">
            {{ response.response }}
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let response" class="actions-cell">
            <button mat-icon-button color="warn" (click)="deleteResponse(response.id)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }

    @if (store.feedbackResponses().length === 0 && !store.loading()) {
      <div class="no-data">
        <mat-icon>forum</mat-icon>
        <p>No responses yet</p>
        <button mat-raised-button color="primary" (click)="addResponse()">
          Add First Response
        </button>
      </div>
    }
  </div>
</div>
